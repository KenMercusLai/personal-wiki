<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  {{ partial "seo.html" . }}
  {{ with resources.Get "css/site.css" }}{{ $css := . | minify | fingerprint }}<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">{{ end }}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ "" | relURL }}">个人知识 Wiki</a>
    <nav class="site-nav" aria-label="主导航">
      <a href="{{ "wiki/" | relURL }}">知识库</a>
      <a href="{{ "wiki/sources/" | relURL }}">来源</a>
      <a href="{{ "wiki/concepts/" | relURL }}">概念</a>
      <a href="{{ "wiki/entities/" | relURL }}">实体</a>
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer">
    <p class="footer-brand"><strong>个人知识 Wiki</strong><br>从阅读材料中持续提炼、连接和维护的知识库。原始材料不随网站发布。</p>
    <nav class="footer-links" aria-label="页脚">
      <a href="{{ "wiki/" | relURL }}">知识库</a>
      <a href="{{ "wiki/sources/" | relURL }}">来源</a>
    </nav>
  </footer>
</body>
</html>
