baseURL = 'https://kenmercuslai.github.io/personal-wiki/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'Ken 的个人知识 Wiki'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
  description = '从个人阅读材料中持续提炼、连接和维护的知识库。'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'wiki'
    target = 'content/wiki'

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML']
  page = ['HTML']
